name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regression tests on real spectra
        run: npm test
      - name: Build web trial
        run: npm run build:web
      - name: Check the macOS core bundle is up to date
        run: |
          npm run build:core
          git diff --exit-code macos/NMRemView/Sources/NMRemView/Resources/nmrcore.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-trial
          path: dist/web

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build NMRemView.app (Apple silicon)
        run: macos/packaging/make-app.sh
      - name: Smoke test, app launches and stays up
        run: |
          macos/NMRemView/out/NMRemView.app/Contents/MacOS/NMRemView > launch.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 $PID 2>/dev/null; then echo "App exited early"; cat launch.log; exit 1; fi
          kill $PID
      - uses: actions/upload-artifact@v4
        with:
          name: NMRemView-macOS-arm64
          path: macos/NMRemView/out/NMRemView-macOS-arm64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" macos/NMRemView/out/NMRemView-macOS-arm64.zip \
            --title "NMRemView $GITHUB_REF_NAME" \
            --notes "NMRemView for macOS 14+ on Apple silicon. Unzip, move NMRemView.app to Applications, then right-click it and choose Open the first time (the app is not notarised yet)."
